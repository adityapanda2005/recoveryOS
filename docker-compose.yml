version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: recoveros
      POSTGRES_PASSWORD: recoveros_dev_pw
      POSTGRES_DB: recoveros
    ports:
      - "5432:5432"
    volumes:
      - recoveros_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoveros -d recoveros"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: apps/api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://recoveros:recoveros_dev_pw@db:5432/recoveros
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  recoveros_pgdata:
